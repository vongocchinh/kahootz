<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a8b"/>
      <stop offset="1" stop-color="#ff164f"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="url(#g)" stroke-width="2.6"
     stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">

    <!-- rocket body -->
    <path d="M20 42
             C20 32 24 19 38 10
             C43 7 50 7 53 8
             C54 12 53 19 50 24
             C42 38 30 43 20 42 Z"/>

    <!-- rocket window -->
    <circle cx="43" cy="17" r="3.4"/>

    <!-- left fin -->
    <path d="M25 29
             C19 28 15 30 13 36
             L23 35"/>

    <!-- lower fin -->
    <path d="M31 38
             C31 44 28 48 22 51
             L24 41"/>

    <!-- flame -->
    <path d="M20 42
             C17 44 15 47 15 50
             C18 49 20 47 22 44"/>

    <!-- motion accent -->
    <path d="M14 40 L9 43"/>
    <path d="M18 51 L14 55"/>
  </g>
</svg>